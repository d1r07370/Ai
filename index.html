

<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Cara AI — Prototipo</title>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0; padding: 24px 16px;

      background: #080d17; color: #f4f7ff;

      font-family: -apple-system, BlinkMacSystemFont, sans-serif;

    }

    main { max-width: 520px; margin: auto; }

    h1 { color: #55c8ff; margin-bottom: 8px; }

    p { color: #b9c5d8; line-height: 1.5; }

    .stage {

      position: relative; width: 100%;

      margin: 20px 0; overflow: hidden;

      border: 1px solid #245b85;

      border-radius: 18px; background: #000;

    }

    video { width: 100%; height: auto; display: block; }

    canvas {

      position: absolute; inset: 0;

      width: 100%; height: 100%;

      pointer-events: none;

    }

    button {

      width: 100%; padding: 15px; margin: 6px 0;

      border: 0; border-radius: 12px;

      font-size: 16px; font-weight: 700;

      background: #39baff; color: #06111e;

    }

    button.secondary { background: #202b3c; color: white; }

    button:disabled { opacity: .5; }

    #status {

      padding: 12px; background: #111c2c;

      border-radius: 10px; font-size: 14px;

    }

    small { color: #93a4ba; }

  </style>

</head>

<body>

<main>

  <h1>Cara AI</h1>

  <p>Prototipo de seguimiento facial en tiempo real.</p>

  <div class="stage">

    <video id="camera" autoplay muted playsinline></video>

    <canvas id="overlay"></canvas>

  </div>

  <div id="status">Cámara apagada.</div>

  <button id="start">Activar cámara y detectar rostro</button>

  <button id="stop" class="secondary" disabled>

    Detener cámara

  </button>

  <p><small>

    Esta versión detecta puntos faciales; aún no sustituye

    rostros. El video de la cámara se procesa en el navegador.

  </small></p>

</main>

<script type="module">

import {

  FaceLandmarker,

  FilesetResolver

} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.querySelector("#camera");

const canvas = document.querySelector("#overlay");

const ctx = canvas.getContext("2d");

const status = document.querySelector("#status");

const start = document.querySelector("#start");

const stop = document.querySelector("#stop");

let landmarker = null;

let stream = null;

let active = false;

let lastVideoTime = -1;

async function loadModel() {

  if (landmarker) return;

  status.textContent = "Cargando el modelo facial...";

  const vision = await FilesetResolver.forVisionTasks(

    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"

  );

  landmarker = await FaceLandmarker.createFromOptions(vision, {

    baseOptions: {

      modelAssetPath:

        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task"

    },

    runningMode: "VIDEO",

    numFaces: 1

  });

}

function drawFrame() {

  if (!active) return;

  if (video.readyState >= 2 &&

      video.videoWidth > 0 &&

      video.currentTime !== lastVideoTime) {

    lastVideoTime = video.currentTime;

    if (canvas.width !== video.videoWidth ||

        canvas.height !== video.videoHeight) {

      canvas.width = video.videoWidth;

      canvas.height = video.videoHeight;

    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    try {

      const result = landmarker.detectForVideo(

        video, performance.now()

      );

      const faces = result.faceLandmarks || [];

      if (faces.length) {

        const points = faces[0];

        ctx.fillStyle = "#36d9ff";

        for (let i = 0; i < points.length; i += 4) {

          const point = points[i];

          ctx.beginPath();

          ctx.arc(

            point.x * canvas.width,

            point.y * canvas.height,

            2, 0, Math.PI * 2

          );

          ctx.fill();

        }

        status.textContent =

          "Rostro detectado · " + points.length +

          " puntos faciales";

      } else {

        status.textContent = "Buscando rostro...";

      }

    } catch (error) {

      status.textContent = "Error procesando la imagen.";

    }

  }

  requestAnimationFrame(drawFrame);

}

start.addEventListener("click", async () => {

  start.disabled = true;

  try {

    status.textContent = "Preparando cámara...";

    await loadModel();

    stream = await navigator.mediaDevices.getUserMedia({

      audio: false,

      video: {

        facingMode: "user",

        width: { ideal: 640 },

        height: { ideal: 960 }

      }

    });

    video.srcObject = stream;

    await video.play();

    active = true;

    lastVideoTime = -1;

    start.disabled = true;

    stop.disabled = false;

    status.textContent = "Cámara activa. Buscando rostro...";

    drawFrame();

  } catch (error) {

    status.textContent =

      "No se pudo iniciar: " + error.message +

      ". Revisa los permisos de cámara y la conexión.";

    start.disabled = false;

  }

});

stop.addEventListener("click", () => {

  active = false;

  if (stream) {

    stream.getTracks().forEach(track => track.stop());

    stream = null;

  }

  video.srcObject = null;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  status.textContent = "Cámara apagada.";

  start.disabled = false;

  stop.disabled = true;

});

</script>

</body>

</html>
